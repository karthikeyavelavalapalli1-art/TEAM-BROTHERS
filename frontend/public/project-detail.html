<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | TEAM BROTHERS</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    :root {
      --color-background: #ffffff;
      --color-foreground: #09090b;
      --font-sans: 'Inter', sans-serif;
      --font-serif: 'Fraunces', serif;
    }
    :root.dark, .dark {
      --color-background: #09090b;
      --color-foreground: #ffffff;
    }
    
    body {
      background-color: var(--color-background);
      color: var(--color-foreground);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .font-serif { font-family: 'Fraunces', serif; }

    .nav-bar {
      padding: 2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-foreground);
      text-decoration: none;
      transition: opacity 0.3s ease;
    }
    .back-btn:hover {
      opacity: 0.7;
    }

    .project-header {
      text-align: center;
      padding: 3rem 5% 4rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .project-category {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 16px;
      border: 1px solid color-mix(in srgb, var(--color-foreground) 20%, transparent);
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      color: color-mix(in srgb, var(--color-foreground) 70%, transparent);
    }

    .project-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    .project-desc {
      font-size: clamp(1rem, 2vw, 1.125rem);
      line-height: 1.6;
      color: color-mix(in srgb, var(--color-foreground) 70%, transparent);
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background: var(--color-foreground);
      color: var(--color-background);
      border-radius: 9999px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .action-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .hero-image-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 5rem;
      padding: 0 5%;
    }

    .hero-image {
      width: 100%;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid color-mix(in srgb, var(--color-foreground) 10%, transparent);
    }

    /* Loading state */
    #loading-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-background);
      z-index: 50;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid color-mix(in srgb, var(--color-foreground) 20%, transparent);
      border-top-color: var(--color-foreground);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <!-- Loading State -->
  <div id="loading-state">
    <div class="spinner"></div>
  </div>

  <!-- Content (Hidden initially) -->
  <div id="main-content" style="display: none;">
    <nav class="nav-bar">
      <a href="project.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
        Back to Projects
      </a>
    </nav>

    <header class="project-header fade-in-up">
      <div id="p-category" class="project-category">Category</div>
      <h1 id="p-title" class="project-title font-serif">Project Title</h1>

      <div id="p-action-container" style="display: none; margin-top: 2rem;">
        <a href="#" id="p-link" target="_blank" class="action-btn">View Live Project</a>
      </div>
    </header>

    <div class="hero-image-container fade-in-up" style="animation-delay: 0.2s; margin-bottom: 2rem;">
      <img id="p-image" src="" alt="Project Showcase" class="hero-image">
    </div>
    
    <div class="fade-in-up" style="animation-delay: 0.3s; text-align: center; padding: 0 5% 5rem;">
      <p id="p-description" class="project-desc">Project description goes here.</p>
    </div>
  </div>

  <script src="project-detail.js" type="module"></script>
</body>

</html>
