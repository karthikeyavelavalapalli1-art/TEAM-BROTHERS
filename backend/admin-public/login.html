<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — TEAM BROTHERS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--color-ink);
      position: relative;
      overflow: hidden;
    }
    
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background-image: linear-gradient(135deg, var(--color-flare), var(--color-grape));
      border-radius: 50%;
      opacity: 0.15;
      filter: blur(80px);
      z-index: -1;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      text-align: center;
      margin: auto;
      box-sizing: border-box;
    }

    .logo-text {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      margin-bottom: 8px;
      display: block;
    }

    .subtitle {
      color: var(--color-mute);
      margin-bottom: 32px;
    }

    .form-group {
      text-align: left;
    }

    .form-group label {
      color: var(--color-mute);
      font-size: 0.85rem;
      margin-bottom: 6px;
      display: block;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 16px;
    }

    #error-message {
      color: var(--color-flare);
      background: rgba(255, 45, 85, 0.1);
      border: 1px solid rgba(255, 45, 85, 0.3);
      padding: 12px;
      border-radius: var(--border-radius-sm);
      margin-bottom: 20px;
      display: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="glass-panel login-container admin-card">
    <h1 class="logo-text text-gradient">TEAM BROTHERS</h1>
    <p class="subtitle">Admin Dashboard Login</p>
    
    <div id="error-message">Invalid username or password.</div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter admin username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-login">Login</button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');
      
      const btn = document.querySelector('.btn-login');
      const originalText = btn.textContent;
      btn.textContent = 'Authenticating...';
      btn.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        if (response.ok) {
          window.location.href = '/';
        } else {
          errorMsg.style.display = 'block';
          btn.textContent = originalText;
          btn.disabled = false;
        }
      } catch (err) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Network error. Please try again.';
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
